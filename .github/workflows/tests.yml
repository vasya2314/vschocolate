name: Tests

on:
  pull_request:
  workflow_dispatch:
  # Вызывается из deploy.yml перед сборкой: на пуш в master тесты запускаются там
  workflow_call:

# Новый пуш в тот же pull request отменяет устаревший прогон; прогон перед деплоем не отменяется
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pest:
    name: Pest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Временная MySQL только для тестов: создаётся на время job и удаляется вместе с ним.
    # Никаких прод-секретов здесь нет и быть не должно.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lara_docker_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # Переменные окружения важнее .env; база и драйвер задаются в phpunit.xml (force="true")
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ vars.PHP_VERSION || '8.4' }}
          extensions: mbstring, bcmath, intl, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run tests
        run: composer test
